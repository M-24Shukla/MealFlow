[build]
  base = "."
  command = "npm --prefix frontend ci --include=dev && npm --prefix frontend run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "24"
  VITE_API_BASE_URL = "/api/v1"

[[redirects]]
  from = "/api/*"
  to = "https://cookdukoobackend.netlify.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
