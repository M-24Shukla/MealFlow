services:
  - type: web
    name: mealflow-api
    runtime: node
    region: singapore
    rootDir: backend
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_CORS_ORIGINS
        sync: false
      - key: SESSION_TTL_DAYS
        value: "14"
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_COOKIE_DOMAIN
        sync: false

  - type: web
    name: mealflow-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
